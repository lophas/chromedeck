name: Publish tested Desktop Chrome release

on:
  push:
    branches: [desktop-chrome]
    paths: [release.json]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-chrome-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify and publish the tested APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag=$(jq -er '.tag' release.json)
          title=$(jq -er '.title' release.json)
          source_release=$(jq -er '.source_release' release.json)
          source_commit=$(jq -er '.source_commit' release.json)
          asset=$(jq -er '.asset' release.json)
          checksum=$(jq -er '.sha256' release.json)

          # Only documentation and publication metadata may differ from the
          # source that produced the device-tested APK.
          git diff --exit-code "$source_commit" "$GITHUB_SHA" -- . \
            ':!README.md' ':!RELEASE_NOTES.md' ':!release.json' \
            ':!docs/TESTING.md' ':!.github/workflows/desktop-chrome-apk.yml'

          source_tag_commit=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$source_release" --jq '.object.sha')
          test "$source_tag_commit" = "$source_commit"
          mkdir -p artifacts
          gh release download "$source_release" --repo "$GITHUB_REPOSITORY" --pattern "$asset" --dir artifacts
          printf '%s  %s\n' "$checksum" "artifacts/$asset" | sha256sum --check
          unzip -t "artifacts/$asset"
          cp release.json artifacts/release.json
          (cd artifacts && sha256sum "$asset" > SHA256SUMS)

          # Retrying publication never replaces an existing release or asset.
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            mkdir -p existing
            test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha')" = "$GITHUB_SHA"
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "$asset" --dir existing
            printf '%s  %s\n' "$checksum" "existing/$asset" | sha256sum --check
            exit 0
          fi
          release_flags=()
          if test "$(jq -r '.prerelease' release.json)" = true; then
            release_flags+=(--prerelease)
          fi
          gh release create "$tag" "artifacts/$asset" artifacts/SHA256SUMS artifacts/release.json \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$title" --notes-file RELEASE_NOTES.md "${release_flags[@]}"
