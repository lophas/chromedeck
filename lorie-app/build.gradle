import groovy.xml.XmlSlurper
import com.android.build.api.artifact.SingleArtifact

apply plugin: 'com.android.application'
apply from: '../lorie/version.gradle'

abstract class VerifySharedUidProcess extends DefaultTask {
    @InputFile
    abstract RegularFileProperty getManifest()

    @TaskAction
    void verify() {
        def root = new XmlSlurper(false, false).parse(manifest.get().asFile)
        def appProcess = root.application.@'android:process'.text()
        def offenders = ['activity', 'activity-alias', 'service', 'receiver', 'provider'].collectMany { type ->
            root.application."$type".findAll { (it.@'android:process'.text() ?: appProcess) != 'com.termux' }
                .collect { "$type ${it.@'android:name'}" }
        }
        if (!offenders.isEmpty())
            throw new GradleException("sharedUid components must run in process com.termux: ${offenders.join(', ')}")
    }
}

android {
    namespace 'com.termux.x11.app'
    packagingOptions.jniLibs.useLegacyPackaging true
    packagingOptions.resources.merges += [
            "META-INF/LICENSE.txt", "META-INF/NOTICE.txt",
            "META-INF/LICENSE", "META-INF/NOTICE", "META-INF/DEPENDENCIES"
    ]
    compileSdkVersion 34
    ndkVersion termuxX11NdkVersion
    defaultConfig {
        ndk { abiFilters "arm64-v8a" }
        applicationId "hu.lophas.desktopchromeandroid"
        minSdkVersion 26
        targetSdkVersion 28
        versionCode 66
        versionName termuxX11VersionName
    }

    flavorDimensions "uid"
    productFlavors {
        standalone {
            dimension "uid"
        }
        sharedUid {
            dimension "uid"
            targetSdkVersion 28
        }
    }

    signingConfigs.debug {
        storeFile file('testkey_untrusted.jks')
        keyAlias 'alias'
        storePassword 'xrj45yWGLbsO7W0v'
        keyPassword 'xrj45yWGLbsO7W0v'
    }

    // Published builds use a private key kept outside the repository; the public
    // Termux:X11 test key is only a fallback for local builds. Android flags apps
    // signed with that key, since anyone can sign with it.
    def signingFile = new File(System.getenv('DESKTOP_CHROME_SIGNING')
            ?: "${System.getProperty('user.home')}/.config/desktop-chrome-android/signing.properties")
    if (signingFile.isFile()) {
        def signing = new Properties()
        signingFile.withInputStream { signing.load(it) }
        signingConfigs.create('desktopChrome') {
            storeFile new File(signingFile.parentFile, signing.getProperty('storeFile'))
            storePassword signing.getProperty('storePassword')
            keyAlias signing.getProperty('keyAlias')
            keyPassword signing.getProperty('keyPassword')
        }
    }

    compileOptions.sourceCompatibility JavaVersion.VERSION_1_9
    compileOptions.targetCompatibility JavaVersion.VERSION_1_9
    buildTypes.debug {
        signingConfig signingConfigs.findByName('desktopChrome') ?: signingConfigs.debug
        minifyEnabled true
        shrinkResources true
        proguardFiles 'proguard-rules.pro'
    }
}

// Release links and instructions point at this name, it does not follow the module.
androidComponents {
    onVariants(selector().all()) { variant ->
        def name = variant.flavorName == 'standalone' ? variant.buildType : "${variant.flavorName}-${variant.buildType}"
        variant.outputs.each { output ->
            output.outputFileName.set(name == 'debug' ? "chromedeck.apk" : "chromedeck-${name}.apk")
        }
        if (variant.flavorName == 'sharedUid') {
            def verify = tasks.register("verify${variant.name.capitalize()}Process", VerifySharedUidProcess) {
                manifest.set(variant.artifacts.get(SingleArtifact.MERGED_MANIFEST.INSTANCE))
            }
            tasks.matching { it.name == "package${variant.name.capitalize()}" }.configureEach { dependsOn(verify) }
        }
    }
}

tasks.matching { it.name == 'assembleDebug' }.configureEach { dependsOn ':shell-loader:buildCompanionPackage' }

dependencies {
    implementation project(':lorie')
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'org.apache.commons:commons-compress:1.28.0'
}


// Bundle keyboard data so startup never depends on a separate Termux installation.
def embeddedX11Assets = layout.buildDirectory.dir("generated/embeddedX11Assets")
android.sourceSets.main.assets.srcDir(embeddedX11Assets.get().asFile)
tasks.register("prepareEmbeddedX11Assets", Exec) {
    inputs.dir("/usr/share/X11/xkb")
    inputs.file(rootProject.file("scripts/prepare-xkb-assets.py"))
    outputs.dir(embeddedX11Assets)
    commandLine "python3", rootProject.file("scripts/prepare-xkb-assets.py").absolutePath,
            "/usr/share/X11/xkb", embeddedX11Assets.get().asFile.absolutePath
}
tasks.named("preBuild").configure { dependsOn "prepareEmbeddedX11Assets" }


// Executables live in the installer-managed native directory, under their .so APK names.
def prootJniLibs = layout.buildDirectory.dir("generated/prootJniLibs")
def prootAssets = layout.buildDirectory.dir("generated/prootAssets")
android.sourceSets.main.jniLibs.srcDir(prootJniLibs.get().asFile)
android.sourceSets.main.assets.srcDir(prootAssets.get().asFile)
tasks.register("prepareNativeRuntime", Exec) {
    inputs.file(rootProject.file("scripts/build-native-runtime.sh"))
    inputs.property("runtimeAbi", "arm64-v8a")
    outputs.dir(prootJniLibs)
    outputs.dir(prootAssets)
    workingDir rootProject.projectDir
    commandLine "bash", rootProject.file("scripts/build-native-runtime.sh").absolutePath
}
tasks.named("preBuild").configure { dependsOn "prepareNativeRuntime" }
